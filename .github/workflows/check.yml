name: offline-checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p check_workflow.py
      - run: python tests/check_ozon.py
      - run: python -m wb_pure --help
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw $errors }
      - run: python install.py --no-schedule --no-browser
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m playwright install --with-deps chromium
          python tests/check_browser.py
